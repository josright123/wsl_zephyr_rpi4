CONFIG_NETWORKING=y
CONFIG_NET_IPV6=n
CONFIG_NET_IPV4=y
CONFIG_NET_ARP=y
CONFIG_NET_UDP=y
CONFIG_NET_DHCPV4=y
CONFIG_NET_DHCPV4_OPTION_CALLBACKS=y
CONFIG_DNS_RESOLVER=y

CONFIG_TEST_RANDOM_GENERATOR=y

CONFIG_INIT_STACKS=y

CONFIG_NET_MGMT=y
CONFIG_NET_MGMT_EVENT=y

CONFIG_NET_LOG=n
CONFIG_LOG=y

CONFIG_SLIP_STATISTICS=n
CONFIG_NET_SHELL=y
CONFIG_SHELL=y
CONFIG_SHELL_BACKEND_SERIAL=y

# Config dm9051 (such as my "overlay_dm9051.conf")
# --- Basic Network Configuration ---
CONFIG_NET_L2_ETHERNET=y
CONFIG_NET_BUF_DATA_SIZE=1024
CONFIG_NET_IPV4_FRAGMENT=y
#(JJ.add)CONFIG_ETH_DM9051=y
#(JJ.test)CONFIG_ETH_DM9051=y
CONFIG_ETH_DM9051=y
CONFIG_SPI=y
CONFIG_SPI_BITBANG=y
CONFIG_GPIO=y
#(JJ.add)CONFIG_ETH_DM9051_DEBUG_PRINTS=y
CONFIG_ETH_DM9051_DEBUG_PRINTS=n

# Add early console init and debugging
CONFIG_EARLY_CONSOLE=y
CONFIG_BOOT_BANNER=y
CONFIG_PRINTK=y
CONFIG_SYS_CLOCK_EXISTS=y
CONFIG_NET_CONFIG_AUTO_INIT=n
